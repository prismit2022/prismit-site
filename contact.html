<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | Prismit</title>
<meta name="description" content="Prismitへのお問い合わせはこちらのフォームからご連絡ください。">
<link rel="stylesheet" href="css/style.css?v=49">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img src="images/logo.svg" alt="" class="logo-img">Prismit</a>
    <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <ul>
        <li><a href="about.html">会社概要</a></li>
        <li><a href="services.html">事業内容</a></li>
        <li><a href="news.html">お知らせ</a></li>
        <li><a href="contact.html" class="is-active" aria-current="page">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>

  <div class="page-hero">
    <div class="container">
      <p class="eyebrow">Contact</p>
      <h1>お問い合わせ</h1>
      <p>ご質問・ご相談など、お気軽にお問い合わせください。</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="contact-hint">
        <h2 class="contact-hint-title">こんなご相談を受け付けています</h2>
        <ul class="contact-hint-list">
          <li>Webサイトや業務システムを新しく作りたい</li>
          <li>今使っているシステムを改善・修正してほしい</li>
          <li>何から相談すればいいかわからない</li>
          <li>まずは見積もりだけ聞いてみたい</li>
        </ul>
      </div>

      <form class="contact-form" id="contactForm" action="https://formspree.io/f/mgawzjan" method="POST">
        <div class="form-row">
          <label for="name">お名前<span class="required">必須</span></label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-row">
          <label for="company">会社名<span class="optional">任意</span></label>
          <input type="text" id="company" name="company">
        </div>
        <div class="form-row">
          <label for="email">メールアドレス<span class="required">必須</span></label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-row">
          <label for="subject">件名</label>
          <input type="text" id="subject" name="subject" placeholder="例: Webサイト制作について">
        </div>
        <div class="form-row">
          <label for="budget">ご予算(目安)<span class="optional">任意</span></label>
          <input type="text" id="budget" name="budget" placeholder="例: 30万円〜50万円、未定など">
        </div>
        <div class="form-row">
          <label for="timeline">ご希望の時期<span class="optional">任意</span></label>
          <input type="text" id="timeline" name="timeline" placeholder="例: 2026年10月頃までに、まだ未定など">
        </div>
        <div class="form-row">
          <label for="message">お問い合わせ内容<span class="required">必須</span></label>
          <textarea id="message" name="message" rows="6" required placeholder="現在お困りのこと、ご希望の内容などをわかる範囲でご記入ください。"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">送信する</button>
        <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Prismit</p>
  </div>
</footer>

<script src="js/script.js?v=8"></script>
</body>
</html>
